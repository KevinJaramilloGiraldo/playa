
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playa Animada</title>

<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    font-family:Arial, Helvetica, sans-serif;
}


.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:linear-gradient(
        to bottom,
        #ffb36b 0%,
        #ff7e5f 35%,
        #d76d77 60%,
        #3a1c71 100%
    );

    animation:skyMove 8s infinite alternate;
}

@keyframes skyMove{
    from{
        filter:brightness(1);
    }

    to{
        filter:brightness(0.9);
    }
}

.text{
    position:absolute;

    top:45%;
    left:50%;

    transform:translate(-50%, -50%);

    width:85%;

    text-align:center;

    color:white;

    font-size:3vw;
    font-weight:bold;

    z-index:10;

    text-shadow:2px 2px 10px rgba(0,0,0,0.5);

    animation:fadeText 3s ease;
}

@keyframes fadeText{

    from{
        opacity:0;
        transform:translate(-50%, -30%);
    }

    to{
        opacity:1;
        transform:translate(-50%, -50%);
    }
}

.sun{
    position:absolute;

    width:12vw;
    height:12vw;

    border-radius:50%;

    background:radial-gradient(circle,#ffe082,#ff9800);

    top:8vh;
    left:50%;

    transform:translateX(-50%);

    box-shadow:0 0 60px rgba(255,200,0,0.8);

    animation:sunMove 5s ease-in-out infinite alternate;
}

 


@keyframes sunMove{

    from{
        transform:translateX(-50%) scale(1);
    }

    to{
        transform:translateX(-50%) scale(1.08);
    }
}

 @keyframes brillo {
        0%,100% {
            opacity: 0.5;
            transform: rotate(var(--angulo)) translateY(-80px) scaleY(1);
        }
        50% {
            opacity:1;
            transform: rotate(var(--angulo)) translateY(-80px) scaleY(1.5);

        }
 }
    

.cloud{
    position:absolute;

    background:white;

    border-radius:50px;

    opacity:0.9;
}

.cloud1{
    width:18vw;
    height:6vw;

    top:12vh;
    left:-25vw;

    animation:moveCloud 20s linear infinite;
}

.cloud2{
    width:22vw;
    height:7vw;

    top:24vh;
    left:-35vw;

    animation:moveCloud 28s linear infinite;
}

.cloud::before,
.cloud::after{
    content:"";

    position:absolute;

    background:white;

    border-radius:50%;
}

.cloud::before{
    width:7vw;
    height:7vw;

    top:-3vw;
    left:2vw;
}

.cloud::after{
    width:8vw;
    height:8vw;

    top:-4vw;
    right:2vw;
}

.cloud span{
    position:absolute;

    width:6vw;
    height:6vw;

    background:white;

    border-radius:50%;

    top:-2vw;
    left:7vw;
}

@keyframes moveCloud{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(150vw);
    }
}


.star{
    position:absolute;

    width:3px;
    height:3px;

    background:white;

    border-radius:50%;

    animation:blink 2s infinite alternate;
}

@keyframes blink{

    from{
        opacity:0.2;
    }

    to{
        opacity:1;
    }
}


.sand{
    position:absolute;

    bottom:30vh;

    width:100%;
    height:12vh;

    background:linear-gradient(
        to top,
        #d9b44a,
        #f4d35e
    );

    border-radius:50% 50% 0 0;
}

.sea{
    position:absolute;

    bottom:0;

    width:100%;
    height:35vh;

    background:linear-gradient(
        to bottom,
        #4fc3f7 0%,
        #0288d1 40%,
        #01579b 100%
    );

    overflow:hidden;
}


.wave{
    position:absolute;

    width:200%;
    height:120px;

    border-radius:40%;

    background:rgba(255,255,255,0.18);

    animation:waveMove 8s linear infinite;
}

.wave1{
    top:-30px;
}

.wave2{
    top:10px;

    opacity:0.5;

    animation-duration:12s;
}

.wave3{
    top:40px;

    opacity:0.3;

    animation-duration:16s;
}

@keyframes waveMove{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }
}


.palm{
    position:absolute;

    right:8%;
    bottom:24vh;

    width:200px;
    height:300px;
}


.trunk{
    position:absolute;

    width:28px;
    height:220px;

    background:linear-gradient(
        to right,
        #5d3415,
        #8b5a2b
    );

    border-radius:20px;

    left:86px;
    bottom:0;
}


.palm::before{
    content:"";

    position:absolute;

    width:24px;
    height:24px;

    background:#7a4b1f;

    border-radius:50%;

    top:68px;
    left:50%;

    transform:translateX(-50%);

    z-index:3;
}


.leaf{
    position:absolute;

    width:110px;
    height:22px;
    border-radius: 20px;
    background:radial-gradient(#a5e907, #257911);

    

    top:80px;
    left:100px;

    transform-origin:left center;

    animation:viento 3s infinite ease-in-out alternate;
}

.leaf1{
    --rot:-180deg;
    transform:rotate(var(--rot));
}

.leaf2{
    --rot:-150deg;
    transform:rotate(var(--rot));
}

.leaf3{
    --rot:-120deg;
    transform:rotate(var(--rot));
}

.leaf4{
    --rot:-90deg;
    transform:rotate(var(--rot));
}

.leaf5{
    --rot:-60deg;
    transform:rotate(var(--rot));
}

.leaf6{
    --rot:-45deg;
    transform:rotate(var(--rot));
}

.leaf7{
    --rot:-25deg;
    transform:rotate(var(--rot));
}

.leaf8{
    --rot:-5deg;
    transform:rotate(var(--rot));
}



@keyframes viento{

    from{
        transform:rotate(var(--rot));
    }

    to{
        transform:rotate(calc(var(--rot) + 6deg));
    }
}



@media(max-width:768px){

    .text{
        font-size:5vw;
    }

    .sun{
        width:20vw;
        height:20vw;
    }

    .palm{
        transform:scale(0.8);

        right:-20px;
    }

    .leaf{
        width:90px;
    }

    .trunk{
        width:22px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="sun"></div>
</div>

    
    <div class="cloud cloud1">
        <span></span>
    </div>

    <div class="cloud cloud2">
        <span></span>
    </div>

  
    <div class="star" style="top:10vh; left:20%;"></div>
    <div class="star" style="top:18vh; left:70%;"></div>
    <div class="star" style="top:12vh; left:85%;"></div>

   
    <div class="text">
        “La belleza real de una persona<br>
        se refleja en la bondad de sus acciones.”
    </div>

    
    <div class="sand"></div>

    
    <div class="palm">

        <div class="trunk"></div>

        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
        <div class="leaf leaf3"></div>
        <div class="leaf leaf4"></div>
        <div class="leaf leaf5"></div>
        <div class="leaf leaf6"></div>
        <div class="leaf leaf7"></div>
        <div class="leaf leaf8"></div>
        
        


    </div>


    <div class="sea">

        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>

    </div>

</div>

</body>
</html>
